[project]
name = "swarmdev"
version = "0.1.0"
description = "Spec-as-Source development swarm harness on top of openJiuwen (contracts, gates, oracle, admission)"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "hypothesis>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["swarmdev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
