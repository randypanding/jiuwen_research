[project]
name = "opc-swarm"
version = "0.1.0"
description = "OPC development swarm kernel: spec-as-source governance, gates, oracle, differential engine, admission ledger (PDR-001)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
]

[project.scripts]
opc-spec-lint = "opc.specrepo.lint:main"
opc-gate = "opc.gates.cli:main"
opc-gate-runner = "opc.gates.runner:main"
opc-oracle = "opc.oracle.cli:main"
opc-diff = "opc.diff.cli:main"
opc-admit = "opc.world.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
