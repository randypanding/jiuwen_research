name: kernel-ci

on:
  push:
    paths: ["kernel/**", ".github/workflows/kernel-ci.yml"]
  pull_request:
    paths: ["kernel/**", ".github/workflows/kernel-ci.yml"]

defaults:
  run:
    working-directory: kernel

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test
        run: python -m pytest tests
      - name: Anti-vacuity meta-tests (explicit)
        run: python -m pytest tests -m meta
