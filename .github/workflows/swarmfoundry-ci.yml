name: swarmfoundry-ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install swarmfoundry + test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest ./swarmfoundry
      - name: Run admission gates (H1/H2/H5/H7 + selftest)
        run: bash ci/run_gates.sh
