name: swarm-kernel-gates

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  kernel-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install kernel + test deps
        working-directory: swarm-kernel
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Contract schema tests
        working-directory: swarm-kernel
        run: python -m pytest tests/contract -q
      - name: Unit tests (gates, oracle, diff, golden, judge, measure, admission, drift, health)
        working-directory: swarm-kernel
        run: python -m pytest tests/unit -q
      - name: Communication tests (bus ACL, relay, isolation)
        working-directory: swarm-kernel
        run: python -m pytest tests/communication -q
      - name: E2E pipeline tests
        working-directory: swarm-kernel
        run: python -m pytest tests/e2e -q

  demo-gate-run:
    runs-on: ubuntu-latest
    needs: kernel-tests
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install kernel
        working-directory: swarm-kernel
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Gate demo - good instance must pass (exit 0)
        working-directory: swarm-kernel
        run: |
          swarm-kernel gates run \
            --instance fixtures/instances/good \
            --oracle fixtures/oracle \
            --spec fixtures/spec/spec.json \
            --out /tmp/gates-good \
            --group fixtures/instances/good fixtures/instances/good2
      - name: Gate demo - bad instance must fail (exit 1)
        working-directory: swarm-kernel
        run: |
          set +e
          swarm-kernel gates run \
            --instance fixtures/instances/bad \
            --oracle fixtures/oracle \
            --spec fixtures/spec/spec.json \
            --out /tmp/gates-bad \
            --group fixtures/instances/bad
          rc=$?
          if [ "$rc" -ne 1 ]; then echo "expected exit 1, got $rc"; exit 9; fi
      - name: Drift demo - stale anchor must be detected (exit 1)
        working-directory: swarm-kernel
        run: |
          set +e
          swarm-kernel drift scan --spec fixtures/spec/spec.json --root fixtures/instances/drift_bad
          rc=$?
          if [ "$rc" -ne 1 ]; then echo "expected exit 1, got $rc"; exit 9; fi
