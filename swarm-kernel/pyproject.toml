[project]
name = "swarm-kernel"
version = "0.1.0"
description = "PDR-001 Spec-as-Source dev-swarm kernel: contracts, gates, oracle, admission"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
swarm-kernel = "swarm_kernel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["swarm_kernel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
